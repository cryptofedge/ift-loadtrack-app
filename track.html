<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Track Your Delivery — IFT Logistics</title>
<link rel="stylesheet" href="css/style.css?v=3">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  #map { width: 100%; height: 46vh; min-height: 320px; background: #0C2547; }
  .leaflet-container { font-family: inherit; }
  .truck-pin {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #E8C88A, #C19A6B);
    border: 3px solid #102E5C;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .dest-pin {
    width: 16px; height: 16px; border-radius: 50%;
    background: #3FA66E;
    border: 3px solid #102E5C;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .track-sheet {
    background: var(--navy-mid);
    border-radius: 20px 20px 0 0;
    margin-top: -20px;
    position: relative;
    z-index: 10;
    padding: 10px 22px 26px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.35);
  }
  .sheet-handle {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    margin: 6px auto 14px;
  }
  .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .sheet-title { font-size: 20px; font-weight: 800; color: var(--off-white); }
  .sheet-sub { font-size: 13px; color: var(--steel); margin-top: 2px; }
  .sheet-close { background: none; border: none; color: var(--steel); font-size: 22px; cursor: pointer; }
  .sheet-section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--steel); margin: 18px 0 6px; }
  .sheet-loc-row { display: flex; justify-content: space-between; align-items: center; }
  .sheet-loc-main { font-size: 16px; font-weight: 700; color: var(--off-white); }
  .sheet-loc-sub { font-size: 13px; color: var(--steel); margin-top: 2px; }
  .sheet-updated { text-align: right; font-size: 12px; color: var(--green); font-weight: 700; }
  .sheet-updated-time { font-size: 11px; color: var(--steel); }
  #driver-contact-row { flex-direction: row; gap: 10px; }
  #driver-contact-row .btn { flex: 1; }
  .trip-history-toggle {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.08);
    cursor: pointer; color: var(--off-white); font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
<div class="app" style="padding-bottom:0;">
  <div class="topbar">
    <div class="brand"><img src="img/logo-mark.png" class="brand-icon" alt="">IFT LOADTRACK</div>
  </div>

  <div id="search-panel" class="container">
    <div class="section-title" style="margin-top:0;">Track Your Delivery</div>
    <div class="hint-text" style="margin-bottom:16px;">Enter the tracking code provided by IFT Logistics to see your shipment's status.</div>

    <div class="card">
      <label for="code-input">Tracking Code</label>
      <input id="code-input" type="text" placeholder="e.g. a1b2c3d4" autocomplete="off" style="text-transform:lowercase;">
      <div class="btn-row">
        <button id="track-btn" class="btn btn-primary btn-lg">TRACK SHIPMENT</button>
      </div>
      <div class="error-text" id="track-error"></div>
    </div>
  </div>

  <div id="map-view" style="display:none;">
    <div id="map"></div>
    <div class="track-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <div class="sheet-title" id="sheet-title">Shipment</div>
          <div class="sheet-sub" id="sheet-sub"></div>
        </div>
        <button class="sheet-close" id="sheet-close" aria-label="Track another shipment">&times;</button>
      </div>

      <div id="driver-section" style="display:none;">
        <div class="sheet-section-label">Driver</div>
        <div class="sheet-loc-row">
          <div>
            <div class="sheet-loc-main" id="driver-name">—</div>
            <div class="sheet-loc-sub" id="driver-truck"></div>
          </div>
        </div>
        <div class="btn-row" id="driver-contact-row" style="display:none;">
          <a id="call-driver-btn" class="btn btn-outline" href="#">&#128222; CALL</a>
          <a id="text-driver-btn" class="btn btn-outline" href="#">&#128172; TEXT</a>
        </div>
      </div>

      <div class="sheet-section-label">Location</div>
      <div class="sheet-loc-row">
        <div>
          <div class="sheet-loc-main" id="sheet-distance">—</div>
          <div class="sheet-loc-sub" id="sheet-route">—</div>
        </div>
        <div>
          <div class="sheet-updated" id="sheet-updated-badge">&#9679; LIVE</div>
          <div class="sheet-updated-time" id="sheet-updated-time"></div>
        </div>
      </div>

      <div class="btn-row">
        <a id="directions-btn" class="btn btn-outline" href="#" target="_blank" rel="noopener">&#128737; DIRECTIONS TO DESTINATION</a>
      </div>

      <div class="trip-history-toggle" id="trip-toggle">
        <span>Trip History</span>
        <span id="trip-caret">&#8250;</span>
      </div>
      <div id="trip-history-body" style="display:none; padding-bottom:10px;"></div>

      <div id="pod-section" style="display:none;">
        <div class="sheet-section-label">Proof of Delivery</div>
        <div id="pod-body" class="hint-text">Loading documents…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/track.js?v=6"></script>
</body>
</html>
