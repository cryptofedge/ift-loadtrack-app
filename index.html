<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IFT LoadTrack — Sign In</title>
<meta name="description" content="IFT LoadTrack — driver logging portal for IFT Logistics LLC. Load tracking, hours of service, and proof of delivery.">
<meta property="og:type" content="website">
<meta property="og:title" content="IFT LoadTrack">
<meta property="og:description" content="Driver portal for IFT Logistics LLC — load tracking, hours of service, and proof of delivery.">
<meta property="og:image" content="https://cryptofedge.github.io/ift-loadtrack-app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://cryptofedge.github.io/ift-loadtrack-app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="IFT LoadTrack">
<meta name="twitter:description" content="Driver portal for IFT Logistics LLC.">
<meta name="twitter:image" content="https://cryptofedge.github.io/ift-loadtrack-app/og-image.png">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="center-screen">
  <div class="auth-card">
    <img src="img/logo-full.png" class="auth-logo" alt="IFT Logistics LLC">
    <h1>IFT LoadTrack</h1>
    <div class="sub">Driver portal — sign in to continue</div>

    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" required autocomplete="email">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" required autocomplete="current-password">
      <div class="btn-row">
        <button type="submit" class="btn btn-primary btn-lg">SIGN IN</button>
      </div>
      <div class="error-text" id="login-error"></div>
    </form>

    <form id="signup-form" style="display:none;">
      <label for="signup-name">Full name</label>
      <input id="signup-name" type="text" required>
      <label for="signup-truck">Truck ID</label>
      <input id="signup-truck" type="text" placeholder="e.g. IFT-4471">
      <label for="signup-email">Email</label>
      <input id="signup-email" type="email" required autocomplete="email">
      <label for="signup-password">Password</label>
      <input id="signup-password" type="password" required minlength="6" autocomplete="new-password">
      <div class="btn-row">
        <button type="submit" class="btn btn-primary btn-lg">CREATE ACCOUNT</button>
      </div>
      <div class="error-text" id="signup-error"></div>
      <div class="hint-text">New drivers get standard access. Dispatcher/admin access is granted by IFT after signup.</div>
    </form>

    <div class="link-toggle">
      <span id="toggle-to-signup">Need an account? <a>Create one</a></span>
      <span id="toggle-to-login" style="display:none;">Already have an account? <a>Sign in</a></span>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js?v=2"></script>
</body>
</html>
