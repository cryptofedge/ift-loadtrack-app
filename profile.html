<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IFT LoadTrack — My Profile</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><img src="img/logo-mark.png" class="brand-icon" alt="">IFT LOADTRACK</div>
    <div class="who" id="who"></div>
  </div>

  <div class="container">
    <a class="back-link" href="dashboard.html">&larr; Back to Dashboard</a>
    <div class="section-title" style="margin-top:0;">My Profile</div>

    <div class="card">
      <label for="full_name">Full Name</label>
      <input id="full_name" type="text">

      <label for="truck_id">Truck ID</label>
      <input id="truck_id" type="text" placeholder="e.g. IFT-4471">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="e.g. 555-123-4567">
      <div class="hint-text">If set, customers tracking a delivery you're driving can call or text you directly. Leave blank to keep your number private.</div>

      <label for="email">Email</label>
      <input id="email" type="text" disabled style="opacity:0.6;">

      <label for="role">Access Level</label>
      <input id="role" type="text" disabled style="opacity:0.6;">

      <div class="btn-row">
        <button id="save-btn" class="btn btn-primary btn-lg">SAVE CHANGES</button>
      </div>
      <div class="error-text" id="save-status"></div>
    </div>
  </div>

  <div class="tabbar">
    <a href="dashboard.html"><span class="icon">&#9679;</span>Dashboard</a>
    <a href="documents.html"><span class="icon">&#128193;</span>Documents</a>
    <a href="tools.html"><span class="icon">&#9878;</span>Tools</a>
    <a id="dispatch-tab" href="dispatch.html" style="display:none;"><span class="icon">&#128203;</span>Dispatch</a>
    <a href="#" id="logout-link"><span class="icon">&#9211;</span>Sign Out</a>
  </div>
</div>

<script type="module" src="js/profile.js?v=3"></script>
</body>
</html>
