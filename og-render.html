<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .wrap {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(ellipse 700px 400px at 30% 20%, rgba(232,200,138,0.16) 0%, transparent 70%),
      radial-gradient(ellipse at top, #1A4480 0%, #102E5C 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, transparent, #C19A6B 20%, #E8C88A 50%, #C19A6B 80%, transparent);
  }
  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8C88A, #C19A6B);
    box-shadow: 0 0 40px rgba(232,200,138,0.8);
    margin-bottom: 28px;
  }
  .title {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #E8C88A, #C19A6B 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 22px;
    font-size: 30px;
    color: #F4F1EA;
    opacity: 0.85;
    letter-spacing: 1px;
  }
  .company {
    margin-top: 50px;
    font-size: 22px;
    color: #5A6B85;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <div class="title">IFT LOADTRACK</div>
    <div class="sub">Driver Portal &middot; Load Logging &amp; Fleet Tracking</div>
    <div class="company">IFT Logistics LLC</div>
  </div>
</body>
</html>
